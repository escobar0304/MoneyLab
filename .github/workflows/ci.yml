name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Pushes made with a GitHub App token do not always create a run, which
  # leaves a branch with no CI and no way to ask for one. This is that way.
  workflow_dispatch:

# A new push makes the run in progress irrelevant, so cancel it rather than
# queueing behind work that is already superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `install`: it fails on a lockfile that has drifted
      # from package.json instead of quietly resolving something else.
      - run: npm ci

      - name: Type check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Only Chromium is configured, so pulling the other two browsers would be
      # a minute of download per run for nothing.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Playwright's webServer builds and serves the app itself.
      - name: Run E2E
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        # Traces and screenshots are only worth keeping when something failed —
        # and that is exactly when a green log tells you nothing.
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
