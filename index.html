<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MoneyLab</title>
    <meta name="description" content="Personal finance, kept entirely on your own device." />
    <!-- Paper's --color-surface-0 and scheme, the default. theme-init.js
         swaps both for ink before first paint, so the browser chrome and the
         canvas behind the page match whichever theme is about to be drawn. -->
    <meta name="theme-color" content="#faf8f5" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- After the metas it rewrites, before anything is painted. Why it is a
         file and not inline is written at the top of it. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
