server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ------------------------------------------------------------------
    # Security headers.
    #
    # `add_header` does not merge across levels: a location block that
    # declares even one of its own drops every header inherited from here.
    # That is why the whole set is repeated in /assets/ below rather than
    # being written once — nginx makes the tidier version silently wrong.
    #
    # The `always` flag keeps them on error responses too, which is where a
    # missing nosniff would otherwise matter most.
    # ------------------------------------------------------------------

    # The app's own policy. It loads no third-party script at all — every
    # TradingView embed now lives behind /embed.html, which has its own policy
    # below — so script-src is 'self' and nothing else. That is the whole point
    # of the split: an XSS here cannot reach for a remote script, and the
    # allowance third-party code needs is confined to the one page that frames
    # it.
    #
    # 'unsafe-inline' appears only under style-src: GSAP and Recharts both
    # animate by writing style attributes, which CSP counts as inline styles.
    # `font-src data:` is required because the bundled variable fonts inline
    # some faces as data URIs.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'";

    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # The frame every TradingView widget is loaded into.
    #
    # Its policy is the mirror image of the app's: third-party script is
    # allowed here and only here, and `frame-ancestors 'self'` lets us frame it
    # while still refusing everyone else. Note the app's own policy says
    # `frame-ancestors 'none'` — applying that to this page too would have it
    # refuse to be framed by the very app that embeds it, which is exactly what
    # happened the first time this was written.
    #
    # The sandbox attribute on the iframe is what actually keeps the ledger out
    # of reach; this bounds where the contained code may talk.
    location = /embed.html {
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://s3.tradingview.com https://*.tradingview.com; style-src 'self' 'unsafe-inline'; img-src data: blob: https://*.tradingview.com; font-src https://*.tradingview.com data:; connect-src https://*.tradingview.com; frame-src https://*.tradingview.com; frame-ancestors 'self'; base-uri 'none'; form-action 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        # The embed has no business with any of these, and the frame is the one
        # place in the app running code we did not write.
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), display-capture=()" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;

        # Repeated, not inherited — see the note above.
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    # Symbol search for the instrument picker.
    #
    # TradingView's search endpoint answers 403 unless the request carries
    # `Origin: https://www.tradingview.com` — isolated one header at a time, and
    # it is the Origin specifically, not the Referer. Both are forbidden headers
    # that page JavaScript cannot set, so the browser can never call this
    # directly; only a proxy can. Forwarding it here is what makes the type-ahead
    # reach beyond the app's built-in catalogue.
    #
    # Nothing from the ledger is involved: the only thing sent is the text typed
    # into the search box.
    location /tv-search {
        # Docker's embedded DNS, re-resolved rather than pinned at start-up —
        # without this nginx caches the address at boot and starts failing days
        # later when the CDN rotates it.
        resolver 127.0.0.11 8.8.8.8 valid=300s ipv6=off;
        set $tv_search "https://symbol-search.tradingview.com/symbol_search/v3/?text=$arg_text&hl=0&lang=en&domain=production";

        proxy_pass $tv_search;
        proxy_ssl_server_name on;
        proxy_set_header Host symbol-search.tradingview.com;
        proxy_set_header Referer "https://www.tradingview.com/";
        proxy_set_header Origin "https://www.tradingview.com";
        proxy_set_header User-Agent $http_user_agent;
        # The response is consumed by fetch() on this same origin, so it needs
        # none of TradingView's own CORS headers.
        proxy_hide_header Access-Control-Allow-Origin;

        proxy_connect_timeout 4s;
        proxy_read_timeout 8s;
    }

    # ECB reference rates for multi-currency entries.
    #
    # Unlike the two TradingView proxies above, this one is not about getting
    # past a gate — Frankfurter is open and needs no key. It is here for
    # privacy: called from the page, it would hand a third party the reader's
    # IP on every lookup, which is the one request that made "nothing leaves
    # your device" not quite true. It also lets the app's CSP be connect-src
    # 'self' and nothing else.
    #
    # What is forwarded is a date and a currency code. Nothing identifies the
    # entry, the amount, or the ledger.
    location /fx/ {
        resolver 127.0.0.11 8.8.8.8 valid=300s ipv6=off;
        set $fx "https://api.frankfurter.dev/v1/";

        proxy_pass $fx;
        proxy_ssl_server_name on;
        proxy_set_header Host api.frankfurter.dev;
        # Deliberately not forwarded: the reader's own User-Agent and Referer
        # would re-identify what the proxy exists to hide.
        proxy_set_header User-Agent "MoneyLab";
        proxy_set_header Referer "";
        proxy_hide_header Access-Control-Allow-Origin;

        proxy_connect_timeout 4s;
        proxy_read_timeout 8s;
    }

    # Quotes for the portfolio, same gate as the search above. One POST carries
    # every held symbol, so a refresh is a single request however much you own.
    #
    # What leaves the device is the list of ticker symbols and nothing else — no
    # quantities, no prices paid, nothing from the ledger.
    location /tv-quote {
        resolver 127.0.0.11 8.8.8.8 valid=300s ipv6=off;
        set $tv_quote "https://scanner.tradingview.com/global/scan";

        proxy_pass $tv_quote;
        proxy_ssl_server_name on;
        proxy_set_header Host scanner.tradingview.com;
        proxy_set_header Referer "https://www.tradingview.com/";
        proxy_set_header Origin "https://www.tradingview.com";
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header Content-Type "application/json";
        proxy_hide_header Access-Control-Allow-Origin;

        proxy_connect_timeout 4s;
        proxy_read_timeout 8s;
    }
}
